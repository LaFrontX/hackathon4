
services:
  ml-service:
    build: ./ml-service
    container_name: ml-service
    ports:
      - "5000:5000"
    restart: unless-stopped
  api-service:
    build: ./api-service
    container_name: api-service
    ports:
      - "8000:8000"
    depends_on:
      - ml-service
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/driver.db
    restart: unless-stopped